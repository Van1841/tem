openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WebWin API for authenticated Google Places prospect discovery and MongoDB-backed leads.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Demo and environment-configured user sessions
  - name: leads
    description: Potential leads saved from Google Places
  - name: search
    description: Business discovery and search history
  - name: setup
    description: External service configuration status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start a sales or admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Credentials are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current session user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: Check whether the required external services are configured
      responses:
        "200":
          description: Safe configuration status (never returns credentials)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /places/suggestions:
    get:
      operationId: getPlaceSuggestions
      tags: [search]
      summary: Get location suggestions or local business-category suggestions
      parameters:
        - in: query
          name: kind
          required: true
          schema:
            type: string
            enum: [location, category]
        - in: query
          name: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Matching suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionList"
        "503":
          description: Google Places suggestions are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /search:
    post:
      operationId: searchBusinesses
      tags: [search]
      summary: Find businesses and save those without a listed website
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessSearchInput"
      responses:
        "200":
          description: Search statistics and newly saved leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          description: Location or category is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: MongoDB or Google Places is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /leads:
    get:
      operationId: getLeads
      tags: [leads]
      summary: Fetch saved potential leads from MongoDB
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: query
          required: false
          schema:
            type: string
            maxLength: 120
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadPage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: MongoDB is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /searches:
    get:
      operationId: getSearchHistory
      tags: [search]
      summary: Fetch recent search statistics
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Recent searches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchHistoryList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: MongoDB is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [leads]
      summary: Get live lead and search totals
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Summary derived from MongoDB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: MongoDB is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: webwin_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]
    SessionUser:
      type: object
      properties:
        email:
          type: string
        role:
          type: string
          enum: [admin, sales]
      required: [email, role]
    SetupStatus:
      type: object
      properties:
        mongodbConfigured:
          type: boolean
        googlePlacesConfigured:
          type: boolean
        demoLoginEnabled:
          type: boolean
      required: [mongodbConfigured, googlePlacesConfigured, demoLoginEnabled]
    Suggestion:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
      required: [value, label]
    SuggestionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Suggestion"
      required: [items]
    BusinessSearchInput:
      type: object
      properties:
        location:
          type: string
          minLength: 2
          maxLength: 120
        category:
          type: string
          minLength: 2
          maxLength: 120
      required: [location, category]
    Coordinates:
      type: object
      properties:
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
      required: [latitude, longitude]
    Lead:
      type: object
      properties:
        id:
          type: string
        placeId:
          type: string
        name:
          type: string
        category:
          type: string
        address:
          type: string
        location:
          $ref: "#/components/schemas/Coordinates"
        phone:
          type: ["string", "null"]
        rating:
          type: ["number", "null"]
        reviewCount:
          type: ["integer", "null"]
        website:
          type: ["string", "null"]
        websiteStatus:
          type: string
          enum: [not_listed]
        googleMapsUrl:
          type: ["string", "null"]
        searchLocation:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - placeId
        - name
        - category
        - address
        - location
        - phone
        - rating
        - reviewCount
        - website
        - websiteStatus
        - googleMapsUrl
        - searchLocation
        - createdAt
    LeadPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required: [items, total, page, pageSize]
    SearchResult:
      type: object
      properties:
        totalProcessed:
          type: integer
        websiteListed:
          type: integer
        newLeads:
          type: integer
        duplicates:
          type: integer
        leads:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
      required: [totalProcessed, websiteListed, newLeads, duplicates, leads]
    SearchHistory:
      type: object
      properties:
        id:
          type: string
        location:
          type: string
        category:
          type: string
        searchedAt:
          type: string
          format: date-time
        totalProcessed:
          type: integer
        websiteListed:
          type: integer
        newLeads:
          type: integer
        duplicates:
          type: integer
      required:
        - id
        - location
        - category
        - searchedAt
        - totalProcessed
        - websiteListed
        - newLeads
        - duplicates
    SearchHistoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHistory"
      required: [items]
    DashboardSummary:
      type: object
      properties:
        totalLeads:
          type: integer
        searchesToday:
          type: integer
        latestSearch:
          oneOf:
            - $ref: "#/components/schemas/SearchHistory"
            - type: "null"
      required: [totalLeads, searchesToday, latestSearch]

